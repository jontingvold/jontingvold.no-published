            font-size: 12px;
            color: #666;
            font-weight: 500;

            width: 100%;

        .color-mode-buttons {

            padding: 5px 8px;
            border-radius: 4px;

            color: #666;

ommune": "Oslo", "district": "Ullern", "male_staff_percentage": 0.0, "minority_percentage": null, "dispensation_percentage": null, "lat": 59.9261643, "lon": 10.672038, "address": "Ullern åpne barnehage, St. Edmunds vei, Abbediengen, Ullern, Oslo, 0275, Norge", "male_staff_percentile": 16.4, "color_minority": "#808080", "color_male_staff": "#d50029", "color_dispensation": "#808080", "color": "#808080"}, {"org_number": "993433187", "name": "Bogerud åpen barnehage", "kommune": "Oslo", "district": "Østensjø", "male_staff_percentage": 0.0, "minority_percentage": null, "dispensation_percentage": null, "lat": 59.8748202, "lon": 10.8435308, "address": "Bogerud åpen barnehage, Stallerudveien, Rustad, Østensjø, Oslo, 0693, Norge", "male_staff_percentile": 16.6, "color_minority": "#808080", "color_male_staff": "#d4002a", "color_dispensation": "#808080", "color": "#808080"}, {"org_number": "973782975", "name": "Bøler Åpne barnehage", "kommune": "Oslo", "district": "Østensjø", "male_staff_percentage": 0.0, "minority_percentage": null, "dispensation_percentage": null, "lat": 59.8824211, "lon": 10.8439885, "address": "Bøler åpne barnehage, Bølerlia, Bøler, Østensjø, Oslo, 0691, Norge", "male_staff_percentile": 16.8, "color_minority": "#808080", "color_male_staff": "#d4002a", "color_dispensation": "#808080", "color": "#808080"}];

        // Store markers for filtering
        const markers = [];
        let currentColorMode = 'minority';
        let currentKommuneFilter = 'all';

        // Create markers for each kindergarten
        kindergartens.forEach(kindergarten => {
            const marker = L.circleMarker([kindergarten.lat, kindergarten.lon], {
                radius: 6,
                fillColor: kindergarten.color,
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });

            // Store kindergarten data with marker
            marker.kindergartenData = kindergarten;

            // Create tooltip content
            function createTooltipContent(kindergarten) {
                let tooltipContent = `
                    <div class="kindergarten-tooltip">
                        <div class="name">${kindergarten.name}</div>
                `;

                if (kindergarten.district) {
                    tooltipContent += `<div class="district">${kindergarten.district}</div>`;
                }

                tooltipContent += `
                    <div class="kommune">${kindergarten.kommune}</div>
                    <div class="data-section">
                        <div class="section-title">Statistikk:</div>
                `;

                // Minority language children
                if (kindergarten.minority_percentage !== null && kindergarten.minority_percentage !== undefined) {
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Minoritetsspråklige:</span>
                            <span class="data-value">
                                ${kindergarten.minority_percentage}%
                                <span class="data-details">(${kindergarten.minority_count || 0}/${kindergarten.total_children || 0} barn)</span>
                            </span>
                        </div>
                    `;
                } else {
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Minoritetsspråklige:</span>
                            <span class="data-value" style="color: #999;">Ingen data</span>
                        </div>
                    `;
                }

                // Male staff percentage
                if (kindergarten.male_staff_percentage !== null && kindergarten.male_staff_percentage !== undefined) {
                    let maleStaffDisplay = `${kindergarten.male_staff_percentage.toFixed(1)}%`;
                    if (kindergarten.male_staff_percentile !== null && kindergarten.male_staff_percentile !== undefined) {
                        maleStaffDisplay += ` <span class="percentile">(${kindergarten.male_staff_percentile.toFixed(0)}. persentil)</span>`;
                    }
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Andel menn:</span>
                            <span class="data-value">${maleStaffDisplay}</span>
                        </div>
                    `;
                } else {
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Andel menn:</span>
                            <span class="data-value" style="color: #999;">Ingen data</span>
                        </div>
                    `;
                }

                // Dispensation percentage
                if (kindergarten.dispensation_percentage !== null && kindergarten.dispensation_percentage !== undefined) {
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Dispensasjoner:</span>
                            <span class="data-value">
                                ${kindergarten.dispensation_percentage}%
                                <span class="data-details">(${(kindergarten.dispensation_staff || 0).toFixed(1)}/${(kindergarten.total_pedagogical_staff || 0).toFixed(1)} årsverk)</span>
                            </span>
                        </div>
                    `;
                } else {
                    tooltipContent += `
                        <div class="data-row">
                            <span class="data-label">Dispensasjoner:</span>
                            <span class="data-value" style="color: #999;">Ingen data</span>
                        </div>
                    `;
                }

                tooltipContent += `
                    </div>
                </div>`;

                return tooltipContent;
            }

            // Bind tooltip that shows on hover
            marker.bindTooltip(createTooltipContent(kindergarten), {
                permanent: false,
                direction: 'top',
                offset: [0, -5]
            });

            // Add hover effects
            marker.on('mouseover', function(e) {
                this.setStyle({
                    radius: 8,
                    weight: 2
                });
            });

            marker.on('mouseout', function(e) {
                this.setStyle({
                    radius: 6,
                    weight: 1
                });
            });

            marker.addTo(map);
            markers.push(marker);
        });

        // Function to update marker colors
        function updateMarkerColors(colorMode) {
            markers.forEach(marker => {
                const kindergarten = marker.kindergartenData;
                let color;

                switch(colorMode) {
                    case 'minority':
                        color = kindergarten.color_minority;
                        break;
                    case 'male_staff':
                        color = kindergarten.color_male_staff;
                        break;
                    case 'dispensation':
                        color = kindergarten.color_dispensation;
                        break;
                    default:
                        color = kindergarten.color_minority;
                }

                marker.setStyle({ fillColor: color });
            });
        }

        // Function to update legend
        function updateLegend(colorMode) {
            const legendTitle = document.getElementById('legendTitle');
            const legendGradient = document.getElementById('legendGradient');
            const legendLabels = document.getElementById('legendLabels');

            switch(colorMode) {
                case 'minority':
                    legendTitle.textContent = 'Andel minoritetsspråklige barn';
                    legendGradient.className = 'legend-gradient minority';
                    legendLabels.innerHTML = '<span>0%</span><span>50%</span><span>100%</span>';
                    break;
                case 'male_staff':
                    legendTitle.textContent = 'Andel menn i personalet (percentil)';
                    legendGradient.className = 'legend-gradient male_staff';
                    legendLabels.innerHTML = '<span>Lav</span><span>50. persentil</span><span>Høy</span>';
                    break;
                case 'dispensation':
                    legendTitle.textContent = 'Andel dispensasjoner (spesped)';
                    legendGradient.className = 'legend-gradient dispensation';
                    legendLabels.innerHTML = '<span>0%</span><span>50%</span><span>100%</span>';
                    break;
            }
        }

        // Function to filter kindergartens
        function filterKindergartens() {
            markers.forEach(marker => {
                const kindergarten = marker.kindergartenData;
                const kommuneMatch = currentKommuneFilter === 'all' || kindergarten.kommune === currentKommuneFilter;

                if (kommuneMatch) {
                    marker.addTo(map);
                } else {
                    marker.remove();
                }
            });
        }

        // Color mode selector event listener
        document.querySelectorAll('input[name="colorMode"]').forEach(radio => {
            radio.addEventListener('change', function(e) {
                currentColorMode = e.target.value;
                updateMarkerColors(currentColorMode);
                updateLegend(currentColorMode);
                localStorage.setItem('kindergartenMapColorMode', currentColorMode);
            });
        });

        // Kommune filter event listener
        document.getElementById('kommuneFilter').addEventListener('change', function(e) {
            currentKommuneFilter = e.target.value;
            filterKindergartens();
            localStorage.setItem('kindergartenMapKommuneFilter', currentKommuneFilter);
        });

        // Load saved preferences
        const savedColorMode = localStorage.getItem('kindergartenMapColorMode');
        if (savedColorMode) {
            document.querySelector(`input[name="colorMode"][value="${savedColorMode}"]`).checked = true;
            currentColorMode = savedColorMode;
            updateMarkerColors(savedColorMode);
            updateLegend(savedColorMode);
        }

        const savedKommuneFilter = localStorage.getItem('kindergartenMapKommuneFilter');
        if (savedKommuneFilter) {
            document.getElementById('kommuneFilter').value = savedKommuneFilter;
            currentKommuneFilter = savedKommuneFilter;
            filterKindergartens();
        }

        // Save map position
        map.on('moveend', function() {
            const center = map.getCenter();
            const zoom = map.getZoom();
            localStorage.setItem('kindergartenMapView', JSON.stringify({
                lat: center.lat,
                lng: center.lng,
                zoom: zoom
            }));
        });

        // Restore map position
        const savedView = localStorage.getItem('kindergartenMapView');
        if (savedView) {
            const view = JSON.parse(savedView);
            map.setView([view.lat, view.lng], view.zoom);
        }

        // Show statistics
        console.log('Loaded ${kindergartens.length} kindergartens');
        const osloCount = kindergartens.filter(k => k.kommune === 'Oslo').length;
        const baerumCount = kindergartens.filter(k => k.kommune === 'Bærum').length;
        console.log(`Oslo: ${osloCount}, Bærum: ${baerumCount}`);
    </script>
